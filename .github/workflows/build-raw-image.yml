name: Build timeclock image

on:
  workflow_dispatch:

concurrency:
  group: build
  # false on purpose: a re-run would otherwise kill the build in flight and
  # report it as "The operation was canceled".
  cancel-in-progress: false

env:
  IMAGE_NAME: applied-timeclock-ubuntu-24.04-server
  BUILD_ROOT: /mnt/packer
  ISO_URL: https://mirror.pilotfiber.com/ubuntu-iso/24.04.3/ubuntu-24.04.3-live-server-amd64.iso
  # runner temp disk, far more space than /

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      - name: Reclaim disk space
        uses: jlumbroso/free-disk-space@main
        with:
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Prepare build volume
        run: |
          set -euxo pipefail
          sudo mkdir -p "$BUILD_ROOT"
          sudo chown "$USER:$USER" "$BUILD_ROOT"
          df -h / /mnt

      # /dev/kvm exists on hosted runners but as root:kvm 0660, and the
      # runner user is not in that group. usermod does not help because
      # group changes miss the already-running session.
      - name: Enable KVM group perms
        run: |
          set -euxo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -e /dev/kvm
          ls -l /dev/kvm

      - name: Install QEMU and OVMF
        run: |
          set -euxo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 qemu-utils ovmf xorriso
          ls -l /usr/share/OVMF/

      - name: Locate OVMF firmware
        id: ovmf
        run: |
          set -euxo pipefail
          # Filename varies by release: OVMF_CODE.fd vs OVMF_CODE_4M.fd
          CODE=$(find /usr/share/OVMF /usr/share/ovmf -name 'OVMF_CODE*.fd' ! -name '*secboot*' ! -name '*ms*' ! -name '*snakeoil*' 2>/dev/null | sort | head -1)
          VARS=$(find /usr/share/OVMF /usr/share/ovmf -name 'OVMF_VARS*.fd' ! -name '*ms*' ! -name '*snakeoil*' 2>/dev/null | sort | head -1)
          test -n "$CODE" && test -n "$VARS"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "vars=$VARS" >> "$GITHUB_OUTPUT"

      - uses: hashicorp/setup-packer@main
        with:
          version: "1.11.2"

      - name: Download ISO
        run: |
          set -euxo pipefail
          curl -fL --retry 5 --retry-delay 5 -o "$BUILD_ROOT/ubuntu.iso" "$ISO_URL"
          SHA=$(sha256sum "$BUILD_ROOT/ubuntu.iso" | cut -d' ' -f1)
          echo "ISO_SHA256=$SHA" >> "$GITHUB_ENV"
          ls -lh "$BUILD_ROOT/ubuntu.iso"

      - name: packer build
        env:
          PKR_VAR_iso_url: file:///mnt/packer/ubuntu.iso
          PKR_VAR_output_dir: /mnt/packer/output
          PKR_VAR_efi_code: ${{ steps.ovmf.outputs.code }}
          PKR_VAR_efi_vars: ${{ steps.ovmf.outputs.vars }}
          PACKER_LOG: 1
          PACKER_LOG_PATH: packer-build.log
        run: |
          set -euxo pipefail
          export PKR_VAR_iso_checksum="sha256:${ISO_SHA256}"
          packer init  packer/
          packer validate packer/
          packer build packer/
          ls -lh /mnt/packer/output/$IMAGE_NAME/

      - name: Convert to raw and verify
        run: |
          set -euxo pipefail
          cd "$BUILD_ROOT/output/$IMAGE_NAME"
          qemu-img info "$IMAGE_NAME"
          # Lossless: qcow2 is a container, guest-visible bytes are identical.
          qemu-img convert -p -f qcow2 -O raw "$IMAGE_NAME" "${IMAGE_NAME}.raw"
          qemu-img compare -f qcow2 -F raw "$IMAGE_NAME" "${IMAGE_NAME}.raw"
          echo "Conversion verified."
          # Hybrid-bootable check: expect an EFI System partition.
          fdisk -l "${IMAGE_NAME}.raw"
          rm -f "$IMAGE_NAME"

      - name: Smoke test — does it boot under UEFI?
        run: |
          set -euxo pipefail
          cp "${{ steps.ovmf.outputs.vars }}" /tmp/VARS.fd
          # Fresh VARS = empty NVRAM, exactly like a new unit with a cloned
          # SSD. This is what proves the BOOTX64.EFI fallback works.
          timeout 180 qemu-system-x86_64 \
            -m 3072 -smp 2 -enable-kvm -machine q35 \
            -drive if=pflash,format=raw,unit=0,readonly=on,file=${{ steps.ovmf.outputs.code }} \
            -drive if=pflash,format=raw,unit=1,file=/tmp/VARS.fd \
            -drive file=$BUILD_ROOT/output/$IMAGE_NAME/${IMAGE_NAME}.raw,format=raw,if=none,id=d0 \
            -device ahci,id=ahci -device ide-hd,drive=d0,bus=ahci.0 \
            -netdev user,id=n0 -device e1000,netdev=n0 \
            -nographic -serial mon:stdio > boot-test.log 2>&1 || true
          if grep -qiE 'login:|Welcome to Ubuntu|systemd\[1\]|Reached target' boot-test.log; then
            echo "Image reached userspace from an empty NVRAM."
          else
            echo "::warning::Could not confirm boot. Review boot-test.log."
            tail -60 boot-test.log
          fi

      - name: Compress
        run: |
          set -euxo pipefail
          cd "$BUILD_ROOT/output/$IMAGE_NAME"
          mv "${IMAGE_NAME}.raw" "${IMAGE_NAME}-${GITHUB_RUN_NUMBER}.raw"
          xz -T0 -9 -v "${IMAGE_NAME}-${GITHUB_RUN_NUMBER}.raw"
          sha256sum *.raw.xz > SHA256SUMS
          cat > FLASH.txt <<EOF
          Write to the device (or a USB stick for testing):

            xz -dc ${IMAGE_NAME}-${GITHUB_RUN_NUMBER}.raw.xz \\
              | sudo dd of=/dev/sdX bs=64M status=progress conv=fsync

          Confirm the target with 'lsblk -o NAME,SIZE,MODEL,TRAN' first.
          On the Geekland unit the internal SSD is /dev/sda (SATA).

          The root filesystem grows to fill the disk automatically on first
          boot, so no manual growpart is needed.

          Build user: packer / packer-build-2026  (throwaway — rotate)
          EOF
          ls -lh

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.IMAGE_NAME }}-${{ github.run_number }}
          path: /mnt/packer/output/${{ env.IMAGE_NAME }}/
          compression-level: 0
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs-${{ github.run_number }}
          path: |
            packer-build.log
            boot-test.log
          retention-days: 7
          if-no-files-found: ignore
